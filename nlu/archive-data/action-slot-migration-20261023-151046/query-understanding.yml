version: "3.1"
nlu:
  - intent: change_brand_scope
    examples: |
      - 제품 하나가 아니라 그 브랜드 소속 상품 모두 합산해줘
      - 한 개만 말고 같은 브랜드의 상품 전부를 보고 싶어
      - 상품별로 고르라는 게 아니고 브랜드 전체 합계야
      - 하나만 선택하지 말고 소속된 상품 전부 더해줘
      - 브랜드 소속 상품을 전부 포함해서 조회해
      - 개별 제품 대신 동일 브랜드 제품 전체로 바꾸자
      - 상품 한 가지 말고 소속 상품을 모두 합쳐서 알려줘
      - 단일 상품이 아니라 해당 상표의 모든 제품이 대상이야
      - 그게 아니라 [브랜드 전체]{"entity":"target_scope","value":"brand"} 말하는 거야
      - 아니 하나 말고 [소속 상품 전부]{"entity":"target_scope","value":"brand"} 합쳐서
      - [같은 브랜드 상품 다]{"entity":"target_scope","value":"brand"} 보자는 거야
      - 그 제품 하나 말고 [브랜드 단위로]{"entity":"target_scope","value":"brand"} 묶어줘
      - 레이델 [제품 전부 합산]{"entity":"target_scope","value":"brand"}해 달라고
      - 아니 [브랜드에 속한 모든 상품]{"entity":"target_scope","value":"brand"}이라고
      - [소속 제품 전체]{"entity":"target_scope","value":"brand"} 기준으로 바꿔
  - intent: change_organization_group
    examples: |
      - 부서마다 얼마나 차지했는지 보여줘
      - 각 조직의 비중을 나눠서 보고 싶어
      - 팀별로 모두 비교하지 말고 표로 보여줘
      - 전체 조직을 한 줄씩 보여줘
      - 아니 한 팀 말고 모든 팀의 편성비중이야
      - 조직별로 나눠달라는 말이야
  - intent: rank_organizations
    examples: |
      - 편성비중이 제일 큰 팀 하나만 알려줘
      - 이번달 가장 많이 편성한 조직은 어디야
      - 가중분 비중 1위 팀이 어디야
      - 9월에 방송 비중이 가장 높은 부서
      - 전체 팀 중 편성비중 최상위 하나만
      - 올해 편성이 제일 많았던 팀 찾아줘
  - intent: change_target
    examples: |
      - [문화팀]{"entity":"organization","value":"문화서비스"} 찾으라니까 왜 다른 팀을 찾았어
      - 아니 [문화서비스팀]{"entity":"organization","value":"문화서비스"} 얘기잖아
      - [문화팀]{"entity":"organization","value":"문화서비스"}으로 대상을 정정해
      - 잘못 찾았어 [문화서비스]{"entity":"organization","value":"문화서비스"}로 바꿔
      - [헬스푸드팀]{"entity":"organization","value":"헬쓰푸드"}으로 고쳐줘
      - [가전팀]{"entity":"organization","value":"가전"}을 찾으라는 뜻이야
  - intent: get_metric_fbe91fd24167
    examples: |
      - 문화서비스팀 올해 [매달]{"entity":"group_by","value":"month"} [방송 점유율]{"entity":"metric","value":"organization_weighted_share"} 보여줘
      - 헬스푸드 [달마다]{"entity":"group_by","value":"month"} [방송 비중]{"entity":"metric","value":"organization_weighted_share"} 어떻게 돼
      - 문화서비스 [편성 점유율]{"entity":"metric","value":"organization_weighted_share"} [월 단위로]{"entity":"group_by","value":"month"} 보고 싶어
      - 헬스 [월마다]{"entity":"group_by","value":"month"} [편성 비율]{"entity":"metric","value":"organization_weighted_share"} 얼마야
      - 가전팀 26년 [차지하는 방송 비율]{"entity":"metric","value":"organization_weighted_share"} 알려줘
  - intent: get_metric_5f2623ed65f2
    examples: |
      - 레이델 [브랜드 전체]{"entity":"target_scope","value":"brand"} 26년 [가중분]{"entity":"metric","value":"weighted_minutes"}
      - 레이델 [같은 브랜드끼리 묶어서]{"entity":"target_scope","value":"brand"} [가중시간]{"entity":"metric","value":"weighted_minutes"} 알려줘
      - 그 항목 대신 [가중시간]{"entity":"metric","value":"weighted_minutes"}으로 바꿔줘
  - intent: get_metric_e04eb29020ea
    examples: |
      - 홀베리 [소속 상품 전부]{"entity":"target_scope","value":"brand"} [취급액]{"entity":"metric","value":"sales"} 보여줘
      - 홀베리 이번달 [취급고]{"entity":"metric","value":"sales"} 얼마나 나왔어
      - 그게 아니라 [취급고]{"entity":"metric","value":"sales"}가 궁금해
  - intent: get_metric_d23be8d11414
    examples: |
      - 레이델 [제품 다 합쳐서]{"entity":"target_scope","value":"brand"} 올해 [한계이익]{"entity":"metric","value":"profit"} 알려줘
      - 마진 말고 [한계이익]{"entity":"metric","value":"profit"} 알려달라고
  - intent: change_month_group
    examples: |
      - 그게 아니라 [달마다 나눠서]{"entity":"group_by","value":"month"} 보여달라고
      - [한 달씩 따로]{"entity":"group_by","value":"month"} 보고 싶은 거야
      - 아니 [매달]{"entity":"group_by","value":"month"} 추이로 보자
      - [월 단위로]{"entity":"group_by","value":"month"} 나눠줘
  - intent: change_count_basis
    examples: |
      - 아니 [방송횟수 기준]{"entity":"share_basis","value":"broadcast_count"}으로
      - 그게 아니라 [횟수로 센 비중]{"entity":"share_basis","value":"broadcast_count"}이야
  - intent: change_weighted_basis
    examples: |
      - [가중분 기준]{"entity":"share_basis","value":"weighted_minutes"} 말한 거야
      - 아니 [가중분 기준]{"entity":"share_basis","value":"weighted_minutes"}으로 바꿔줘
