<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>우사기 · 상품별 실적</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src https: data:">
<link rel="stylesheet" href="power-bi.css"></head><body><main id="bubble">
<header class="launcher"><span class="brand">🐰 우사기</span><button id="hide" aria-label="닫기">×</button></header>
<div class="input-rows">
<form id="search-form"><label class="row-label" for="keyword">1. 실적 검색 :</label><div class="input-wrap"><input id="keyword" role="combobox" aria-label="편성코드명" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" placeholder="편성코드명" maxlength="2000" autocomplete="off"><div id="suggestions" role="listbox" hidden></div></div><button id="search" type="submit">검색</button><button id="clear" type="button">초기화</button></form>
<form id="talk-form"><label class="row-label" for="talk-input">2. 다른 이야기하기 :</label><input id="talk-input" aria-label="다른 이야기하기" placeholder="우사기에게 이야기해주세요" maxlength="2000" autocomplete="off"><button id="talk-send" type="submit">말하기</button></form>
</div>
<p id="status" role="status" hidden></p>
<section id="conversation" aria-label="다른 이야기" hidden></section>
<div id="content" hidden>
<div class="report-top">
<div class="slicers">
<label>편성코드<select id="filter-program" aria-label="편성코드"></select></label>
<label>거래형태<select id="filter-deal" aria-label="거래형태"></select></label>
<label>심야구분<select id="filter-night" aria-label="심야구분"></select></label>
<label>영상구분<select id="filter-video" aria-label="영상구분"></select></label>
</div>
<section id="top-cards" aria-label="주요 지표"></section>
</div>
<div class="selection-line"><span id="context"></span><button id="all" type="button" hidden>방송 선택 해제</button></div>
<section id="results" aria-label="방송 실적 상세 표"></section>
<div class="report-bottom">
<section id="ratios" aria-label="방송중 비율"></section>
<section id="year" aria-label="연별 실적"></section>
<section id="month" aria-label="월별 실적"></section>
<section id="hour" aria-label="시간 요일 실적"></section>
<section id="image" aria-label="상품 이미지"></section>
</div>
<details id="extra"><summary>선택 방송의 전체 구분 필드 · 원본 지표 이름</summary><div id="extra-content"></div></details>
</div>
</main><script src="power-bi.js"></script></body></html>
